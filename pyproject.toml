[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-pinns"
version = "0.1.0"
description = "Chart-based manifold PINNs with universal autoencoder atlases."
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.25,<0.7",
  "jaxlib>=0.4.25,<0.7",
  "flax>=0.8,<0.12",
  "optax>=0.2,<0.4",
  "ml-collections>=0.1,<1",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "networkx>=3,<4",
  "trimesh>=4,<5",
  "torch>=2,<3",
  "matplotlib>=3.7,<4",
  "wandb>=0.16,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "manifold_pinns*",
  "charts*",
  "datasets*",
  "pinns*",
  "universal_autoencoder*",
]
namespaces = true
